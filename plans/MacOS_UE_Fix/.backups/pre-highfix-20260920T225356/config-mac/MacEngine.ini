; MacEngine.ini - macOS-only engine settings for awsTutorial (2026-09-20). Master copy:
; plans/MacOS_UE_Fix/graphics-autotune/config/Mac/MacEngine.ini; identical in both projects' Config/Mac/.
;
; Occlusion queries are OFF on macOS. A Shipping build on the Mac froze before the level every time (build 33,
; 2026-09-20): the render thread sat in FMetalRHIRenderQuery::GetResult waiting, half a second per primitive per
; frame, for occlusion-query results that never arrive under Shipping - the query command buffers never signal
; completion there, while the identical Development build runs normally. Sampled with `sample`, reproduced with the
; window repair off and with r.GPUCrashDebugging=1 (the only Shipping-gated Metal command-buffer difference), so
; neither is the cause. With this setting the same Shipping app ran and reached the level. Development gets it too
; so the two configurations behave alike and the auto-tuner measures what Shipping will run.
; Report: plans/MacOS_UE_Fix/report/quit-crash-and-window-repair-2026-09-20.md, section 7.

[SystemSettings]
r.AllowOcclusionQueries=0
